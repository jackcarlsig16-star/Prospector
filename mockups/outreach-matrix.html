        { day: 14, type: "meeting", status: "meeting", label: "Discovery call booked", subject: "Intro call with their VP of Ops" }
      ]
    },
    {
      id: "cornerstone", name: "Cornerstone Realty Partners", business: "HomeLover", activeCycle: false,
      steps: [
        { day: 7, type: "email", status: "sent", label: "Step 1 — Cold intro", subject: "A relocation perk your renters will actually use" },
        { day: 14, type: "email", status: "sent", label: "Step 2 — Value follow-up", subject: "The ROI math on this, roughly" },
        { day: 21, type: "email", status: "scheduled", label: "Step 3 — Case study nudge", subject: "One more example before I follow up again" }
      ]
    },
    {
      id: "ace", name: "Ace Hardware Co-op", business: "Master Magnetics", activeCycle: false,
      steps: [
        { day: 4, type: "email", status: "sent", label: "Step 1 — Cold intro", subject: "Magnetic fixtures for co-op member stores" },
        { day: 11, type: "email", status: "sent", label: "Step 2 — Product fit", subject: "Sized for your current shelf sets" },
        { day: 18, type: "email", status: "generated", label: "Step 3 — Pricing nudge", subject: "Draft ready — includes co-op volume pricing" },
        { day: 25, type: "email", status: "scheduled", label: "Step 4 — Check-in", subject: "Worth a sample order?" }
      ]
    },
    {
      id: "truevalue", name: "True Value Distribution", business: "Master Magnetics", activeCycle: false,
      steps: [
        { day: 9, type: "email", status: "sent", label: "Step 1 — Cold intro", subject: "Distribution terms for magnetic hardware lines" },
        { day: 16, type: "email", status: "overdue", label: "Step 2 — Value follow-up", subject: "Quick numbers on freight + lead time" },
        { day: 23, type: "email", status: "scheduled", label: "Step 3 — Direct ask", subject: "Can we get 15 minutes with procurement?" }
      ]
    },
    {
      id: "bluebottle", name: "Blue Bottle Wholesale", business: "Kopi Kita", activeCycle: true,
      steps: [
        { day: 2, type: "email", status: "sent", label: "Step 1 — Cold intro", subject: "Single-origin lots for your wholesale program" },
        { day: 9, type: "email", status: "sent", label: "Step 2 — Sample offer", subject: "Sending 3 lots for cupping this week" },
        { day: 16, type: "email", status: "sent", label: "Step 3 — Follow-up on samples", subject: "What'd the cupping panel think?" },
        { day: 23, type: "email", status: "scheduled", label: "Step 4 — Direct ask", subject: "Ready to talk volume pricing?" },
        { day: 12, type: "meeting", status: "meeting", label: "Discovery call booked", subject: "Call with their sourcing lead" }
      ]
    },
    {
      id: "cornercoffee", name: "Corner Coffee Collective", business: "Kopi Kita", activeCycle: false,
      steps: [
        { day: 10, type: "email", status: "sent", label: "Step 1 — Cold intro", subject: "A sourcing story your regulars would like" },
        { day: 17, type: "email", status: "overdue", label: "Step 2 — Value follow-up", subject: "The farm-direct angle, one more time" },
        { day: 24, type: "email", status: "scheduled", label: "Step 3 — Case study nudge", subject: "One roaster's numbers after switching" }
      ]
    }
  ];

  /* ---------------- State ---------------- */
  var state = {
    business: "all",
    query: "",
    overdueOnly: false,
    activeOnly: false,
    periodOffset: 0,
    selectedAccountId: null,
    highlightKey: null
  };

  var MIN_OFFSET = -2, MAX_OFFSET = 2;

  /* ---------------- Date helpers ---------------- */
  function addDays(date, n) {
    var d = new Date(date.getTime());
    d.setDate(d.getDate() + n);
    return d;
  }
  function fmtShort(d) {
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function fmtLong(d) {
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }
  var DOW = ["S", "M", "T", "W", "T", "F", "S"];

  function windowStart() {
    return addDays(ANCHOR_START, state.periodOffset * 28);
  }
  function dayDate(idx) {
    return addDays(windowStart(), idx);
  }
  function isWeekend(idx) {
    var dow = dayDate(idx).getDay();
    return dow === 0 || dow === 6;
  }
  function todayIndexForCurrentWindow() {
    return state.periodOffset === 0 ? TODAY_INDEX_IN_ANCHOR : null;
  }

  /* ---------------- Rendering ---------------- */
  var gridEl = document.getElementById("grid");
  var resultCountEl = document.getElementById("resultCount");
  var emptyStateEl = document.getElementById("emptyState");
  var matrixScrollEl = document.getElementById("matrixScroll");

  function visibleAccounts() {
    return ACCOUNTS.filter(function (a) {
      if (state.business !== "all" && a.business !== state.business) return false;
      if (state.query && a.name.toLowerCase().indexOf(state.query.toLowerCase()) === -1) return false;
      if (state.overdueOnly && !a.steps.some(function (s) { return s.status === "overdue"; })) return false;
      if (state.activeOnly && !a.activeCycle) return false;
      return true;
    });
  }

  function el(tag, className, attrs) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "text") e.textContent = attrs[k];
        else if (k === "html") e.innerHTML = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
    }
    return e;
  }

  function markGlyph(status) {
    if (status === "sent") return "✓";
    if (status === "generated") return "✎";
    if (status === "overdue") return "!";
    return "";
  }

  function buildMark(step, accountId) {
    var wrap = el("div", "mark " + step.status + (step.type === "meeting" ? " meeting" : ""));
    var glyph = el("span", step.type === "meeting" ? "glyph" : "", { text: step.type === "meeting" ? "★" : markGlyph(step.status) });
    wrap.appendChild(glyph);
    wrap.dataset.accountId = accountId;
    wrap.dataset.stepKey = accountId + "-" + step.day + "-" + step.label;
    wrap.addEventListener("mouseenter", function (ev) { showTooltip(ev, step); });
    wrap.addEventListener("mousemove", moveTooltip);
    wrap.addEventListener("mouseleave", hideTooltip);
    wrap.addEventListener("click", function (ev) {
      ev.stopPropagation();
      openDrawer(accountId, wrap.dataset.stepKey);
    });
    return wrap;
  }

  function render() {
    gridEl.innerHTML = "";
    var start = windowStart();
    var end = addDays(start, 27);
    document.getElementById("periodLabel").textContent = fmtShort(start) + " – " + fmtShort(end) + ", " + end.getFullYear();
    document.getElementById("prevPeriod").disabled = state.periodOffset <= MIN_OFFSET;
    document.getElementById("nextPeriod").disabled = state.periodOffset >= MAX_OFFSET;

    // Row 1: week group labels
    gridEl.appendChild(el("div", "cell head-spacer"));
    for (var w = 0; w < 4; w++) {
      var wStart = addDays(start, w * 7);
      gridEl.appendChild(el("div", "cell head-week", { text: "Week of " + fmtShort(wStart) }));
    }

    // Row 2: day sub-header
    var todayIdx = todayIndexForCurrentWindow();
    gridEl.appendChild(el("div", "cell head-name", { text: "Accounts" }));
    for (var i = 0; i < 28; i++) {
      var d = dayDate(i);
      var cls = "cell head-day" + (isWeekend(i) ? " weekend" : "") + (i === todayIdx ? " is-today" : "");
      var cell = el("div", cls);
      cell.appendChild(el("div", "dow", { text: DOW[d.getDay()] }));
      cell.appendChild(el("div", "num", { text: String(d.getDate()) }));
      gridEl.appendChild(cell);
    }

    // Account rows
    var accounts = visibleAccounts();
    accounts.forEach(function (a) {
      var nameCell = el("div", "cell row-name" + (a.activeCycle ? " is-active-cycle" : ""));
      nameCell.appendChild(el("div", "avatar", { text: initials(a.name) }));
      var textWrap = el("div", "row-name-text");
      textWrap.appendChild(el("div", "acct", { text: a.name }));
      var bizRow = el("div", "biz");
      if (a.activeCycle) bizRow.appendChild(el("span", "active-dot"));
      bizRow.appendChild(document.createTextNode(a.business + (a.activeCycle ? " · Active cycle" : "")));
      textWrap.appendChild(bizRow);
      nameCell.appendChild(textWrap);
      nameCell.addEventListener("click", function (acctId) {
        return function () { openDrawer(acctId, null); };
      }(a.id));
      gridEl.appendChild(nameCell);

      var stepsByDay = {};
      a.steps.forEach(function (s) {
        if (!stepsByDay[s.day]) stepsByDay[s.day] = [];
        stepsByDay[s.day].push(s);
      });

      for (var di = 0; di < 28; di++) {
        var dCell = el("div", "cell day-cell" + (isWeekend(di) ? " weekend" : ""));
        var daySteps = stepsByDay[di];
        if (daySteps) {
          daySteps.forEach(function (s) { dCell.appendChild(buildMark(s, a.id)); });
        }
        gridEl.appendChild(dCell);
      }
    });

    // Empty state
    emptyStateEl.style.display = accounts.length === 0 ? "block" : "none";
    matrixScrollEl.style.display = accounts.length === 0 ? "none" : "block";

    // Today line
    var oldLine = document.querySelector(".today-line");
    if (oldLine) oldLine.remove();
    if (todayIdx !== null && accounts.length > 0) {
      var left = 290 + todayIdx * 32 + 16;
      var line = el("div", "today-line");
      line.style.left = left + "px";
      matrixScrollEl.appendChild(line);
    }

    // Result count
    var total = ACCOUNTS.length;
    resultCountEl.textContent = "Showing " + accounts.length + " of " + total + " accounts";

    // Clear filters visibility
    var filtered = state.business !== "all" || state.query || state.overdueOnly || state.activeOnly;
    document.getElementById("clearFilters").style.display = filtered ? "inline-block" : "none";
  }

  /* ---------------- Filters UI ---------------- */
  var bizChipsEl = document.getElementById("bizChips");
  function renderChips() {
    bizChipsEl.innerHTML = "";
    var all = el("button", "chip" + (state.business === "all" ? " active" : ""), { text: "All businesses" });
    all.addEventListener("click", function () { state.business = "all"; renderChips(); render(); });
    bizChipsEl.appendChild(all);
    BUSINESSES.forEach(function (b) {
      var chip = el("button", "chip" + (state.business === b ? " active" : ""), { text: b });
      chip.addEventListener("click", function () { state.business = b; renderChips(); render(); });
      bizChipsEl.appendChild(chip);
    });
  }
  renderChips();

  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });
  document.getElementById("overdueChip").addEventListener("click", function () {
    state.overdueOnly = !state.overdueOnly;
    this.classList.toggle("active", state.overdueOnly);
    render();
  });
  document.getElementById("activeChip").addEventListener("click", function () {
    state.activeOnly = !state.activeOnly;
    this.classList.toggle("active", state.activeOnly);
    render();
  });
  document.getElementById("clearFilters").addEventListener("click", function () {
    state.business = "all"; state.query = ""; state.overdueOnly = false; state.activeOnly = false;
    document.getElementById("searchInput").value = "";
    document.getElementById("overdueChip").classList.remove("active");
    document.getElementById("activeChip").classList.remove("active");
    renderChips(); render();
  });

  document.getElementById("prevPeriod").addEventListener("click", function () {
    if (state.periodOffset > MIN_OFFSET) { state.periodOffset--; render(); }
  });
  document.getElementById("nextPeriod").addEventListener("click", function () {
    if (state.periodOffset < MAX_OFFSET) { state.periodOffset++; render(); }
  });
  document.getElementById("jumpToday").addEventListener("click", function () {
    state.periodOffset = 0; render();
  });

  /* ---------------- Tooltip ---------------- */
  var tooltipEl = document.getElementById("tooltip");
  function showTooltip(ev, step) {
    var d = dayDate(step.day);
    tooltipEl.innerHTML = "<b>" + step.label + "</b>" +
      fmtLong(d) + "<br>“" + step.subject + "”" +
      "<span class='tt-status'>" + STATUS_LABEL[step.status] + "</span>";
    tooltipEl.classList.add("show");
    moveTooltip(ev);
  }
  function moveTooltip(ev) {
    var x = ev.clientX + 14, y = ev.clientY + 14;
    var maxX = window.innerWidth - 236, maxY = window.innerHeight - 100;
    tooltipEl.style.left = Math.min(x, maxX) + "px";
    tooltipEl.style.top = Math.min(y, maxY) + "px";
  }
  function hideTooltip() { tooltipEl.classList.remove("show"); }

  /* ---------------- Drawer ---------------- */
  var overlayEl = document.getElementById("overlay");
  var drawerEl = document.getElementById("drawer");

  function openDrawer(accountId, highlightKey) {
    var a = ACCOUNTS.filter(function (x) { return x.id === accountId; })[0];
    if (!a) return;
    state.selectedAccountId = accountId;
    state.highlightKey = highlightKey;

    document.getElementById("drawerAvatar").textContent = initials(a.name);
    document.getElementById("drawerName").textContent = a.name;
    document.getElementById("drawerBiz").textContent = a.business + (a.activeCycle ? " · Active sales cycle" : "");

    var body = document.getElementById("drawerBody");
    body.innerHTML = "";

    // Action banner: pick most urgent state
    var todayIdx = todayIndexForCurrentWindow();
    var overdue = a.steps.filter(function (s) { return s.status === "overdue"; });
    var ready = a.steps.filter(function (s) { return s.status === "generated"; });
    if (overdue.length) {
      var d0 = dayDate(overdue[0].day);
      body.appendChild(el("div", "action-banner warn", { text: "⚠ " + overdue[0].label + " was due " + fmtShort(d0) + " — not yet marked sent." }));
    } else if (ready.length) {
      body.appendChild(el("div", "action-banner ready", { text: "✎ " + ready[0].label + " has a draft ready — send it today." }));
    } else if (a.activeCycle) {
      body.appendChild(el("div", "action-banner ok", { text: "✓ In an active sales cycle — cadence is on track." }));
    }

    body.appendChild(el("div", "timeline-label", { text: "Cadence timeline" }));

    var sorted = a.steps.slice().sort(function (x, y) { return x.day - y.day; });
    sorted.forEach(function (s) {
      var key = accountId + "-" + s.day + "-" + s.label;
      var row = el("div", "step" + (key === highlightKey ? " highlight" : ""));
      var markWrap = el("div", "step-mark");
      markWrap.appendChild(buildStaticMark(s));
      row.appendChild(markWrap);
      var b = el("div", "step-body");
      b.appendChild(el("div", "step-date", { text: fmtLong(dayDate(s.day)) }));
      b.appendChild(el("div", "step-title", { text: s.label }));
      b.appendChild(el("div", "step-subject", { text: "“" + s.subject + "”" }));
      var pill = el("span", "step-status-pill " + s.status, { text: STATUS_LABEL[s.status] });
      b.appendChild(pill);
      row.appendChild(b);
      body.appendChild(row);
      if (key === highlightKey) {
        setTimeout(function () { row.scrollIntoView({ block: "center", behavior: "smooth" }); }, 60);
      }
    });

    overlayEl.classList.add("open");
    drawerEl.classList.add("open");
  }

  function buildStaticMark(step) {
    var wrap = el("div", "mark " + step.status + (step.type === "meeting" ? " meeting" : ""));
    wrap.style.cursor = "default";
    wrap.appendChild(el("span", step.type === "meeting" ? "glyph" : "", { text: step.type === "meeting" ? "★" : markGlyph(step.status) }));
    return wrap;
  }

  function closeDrawer() {
    overlayEl.classList.remove("open");
    drawerEl.classList.remove("open");
    state.selectedAccountId = null;
    state.highlightKey = null;
  }

  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  overlayEl.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  /* ---------------- Init ---------------- */
  render();
})();
</script>
</body>
</html>
