<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Tool</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'SF Mono',ui-monospace,'Cascadia Code','Fira Code',Consolas,monospace;background:#0D0F12;color:#E2E4E8;font-size:13px}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:#0D0F12}
  ::-webkit-scrollbar-thumb{background:#2A2D35;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const C = {
  bg:"#0D0F12", card:"#141618", sur:"#1A1D23", brd:"#2A2D35", brdM:"#3A3D45",
  txt:"#E2E4E8", mut:"#6B7280", dim:"#4B5563",
  gold:"#F5C842", goldBg:"#0F0C02", goldBdr:"#3A3000", goldTxt:"#FFE080",
  green:"#4ADE80", red:"#F87171", blue:"#60A5FA",
  purple:"#A78BFA", orange:"#FB923C", tin:"#94A3B8",
};
const mono = {fontFamily:"'SF Mono',ui-monospace,monospace"};

const PF_TIERS = [
  {id:"base",    label:"Base",    amount:2000  },
  {id:"plus",    label:"Plus",    amount:5000  },
  {id:"premium", label:"Premium", amount:15000 },
];

const PRODUCTS_DEFAULT = [
  {id:"pp1", name:"Core Verify",      rack:1.500, type:"S", cat:"Auth",              included:false},
  {id:"pp2", name:"Core Verify Plus", rack:2.750, type:"S", cat:"Auth",              included:true },
  {id:"pp3", name:"Balance Insights", rack:0.100, type:"T", cat:"Transactions",      included:true },
];

const fmt  = n => n==null?"—":`$${Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtK = n => Math.abs(n)>=1000?`$${(n/1000).toFixed(1)}k`:fmt(n);
const fmtR = n => n==null?"TBD":`$${Number(n).toFixed(3)}`;

const btn = (active, col) => ({
  ...mono, fontSize:11, padding:"5px 13px",
  background:active?`${col}22`:"transparent",
  border:`1px solid ${active?col:C.brd}`,
  color:active?col:C.mut, borderRadius:5, cursor:"pointer", fontWeight:active?600:400,
  transition:"all 0.12s",
});
const inp = (w, col=C.brdM) => ({
  ...mono, width:w, background:C.bg, border:`1.5px solid ${col}`, borderRadius:4,
  color:C.txt, fontSize:12, padding:"4px 7px", outline:"none",
});

function App() {
  const [tab, setTab] = useState("pricing");
  const [customer, setCustomer] = useState("");
  const [copiedP, setCopiedP] = useState(false);
  const [copiedR, setCopiedR] = useState(false);
  const [copiedD, setCopiedD] = useState(false);

  // ── Pricing ──
  const [products,     setProducts]    = useState(PRODUCTS_DEFAULT.map(p=>({...p,custom:p.rack})));
  const [monthlyUsers, setMonthlyUsers]= useState(Array(12).fill(0));
  const [avgAccounts,  setAvgAccounts] = useState(2.5);
  const [commitFee,    setCommitFee]   = useState(0);
  const [pfTier,    setPfTier]    = useState(null);
  const [pfDiscount,setPfDiscount]= useState({enabled:false,type:"flat",amount:0});
  const [pfRamp,    setPfRamp]    = useState(false);
  const [pfRampSched,setPfRampSched] = useState(Array(12).fill(0));
  const [isPartner, setIsPartner] = useState(false);
  const [partnerFee,setPartnerFee]= useState(1000);

  // ── ROI ──
  const [revPerUser,   setRevPerUser]   = useState(75);
  const [curConv,      setCurConv]      = useState(65);
  const [newConv,    setNewConv]    = useState(82);
  const [intCost,      setIntCost]      = useState(20000);
  const [opsOn,        setOpsOn]        = useState(false);
  const [hrsSaved,     setHrsSaved]     = useState(0.4);
  const [hrCost,       setHrCost]       = useState(75);
  const [fraudOn,      setFraudOn]      = useState(false);
  const [fraudLoss,    setFraudLoss]    = useState(0);
  const [fraudPct,     setFraudPct]     = useState(30);

  // ── Pricing calcs ──
  const tierAmt = PF_TIERS.find(t=>t.id===pfTier)?.amount||0;
  const discTierAmt = pfDiscount.enabled&&pfTier
    ? Math.max(0, pfDiscount.type==="pct" ? tierAmt*(1-pfDiscount.amount/100) : tierAmt-pfDiscount.amount)
    : tierAmt;
  const dealPfAt  = i => pfRamp?(pfRampSched[i]||0):discTierAmt;
  const newAtMo   = i => i===0?(monthlyUsers[0]||0):Math.max(0,(monthlyUsers[i]||0)-(monthlyUsers[i-1]||0));

  const breakdown = useMemo(()=>{
    const inc = products.filter(p=>p.included);
    return Array.from({length:12},(_,i)=>{
      const active = monthlyUsers[i]||0;
      const newU   = newAtMo(i);
      const conn   = newU*avgAccounts;
      const single = inc.filter(p=>p.type==="S").reduce((s,p)=>{const r=p.custom??p.rack;return r!=null?s+r*conn:s;},0);
      const recur  = inc.filter(p=>p.type==="R").reduce((s,p)=>{const r=p.custom??p.rack;return r!=null?s+r*active:s;},0);
      const api    = single+recur;
      const floor  = commitFee||0;
      const charge = floor>0?Math.max(api,floor):api;
      const pf     = dealPfAt(i);
      const pfee   = isPartner?(partnerFee||0):0;
      const total  = charge+pf+pfee;
      // rack
      const bSingle = inc.filter(p=>p.type==="S").reduce((s,p)=>p.rack!=null?s+p.rack*conn:s,0);
      const bRecur  = inc.filter(p=>p.type==="R").reduce((s,p)=>p.rack!=null?s+p.rack*active:s,0);
      const bApi    = bSingle+bRecur;
      const bCharge = floor>0?Math.max(bApi,floor):bApi;
      const baseTotal = bCharge+tierAmt+pfee;
      return {mo:i+1,active,newU,conn,single,recur,api,charge,pf,pfee,total,baseTotal,savings:baseTotal-total};
    });
  },[products,monthlyUsers,avgAccounts,commitFee,pfTier,pfDiscount,pfRamp,pfRampSched,isPartner,partnerFee]);

  const annTotal   = breakdown.reduce((s,m)=>s+m.total,0);
  const annBase    = breakdown.reduce((s,m)=>s+m.baseTotal,0);
  const annSavings = breakdown.reduce((s,m)=>s+m.savings,0);
  const annPf      = breakdown.reduce((s,m)=>s+m.pf,0);
  const annPfee    = breakdown.reduce((s,m)=>s+m.pfee,0);
  const endUsers   = monthlyUsers[11]||0;

  // ── ROI calcs ──
  const convFrac    = newConv>0?Math.max(0,Math.min(1,(newConv-curConv)/newConv)):0;
  const incrUsers   = Math.round(endUsers*convFrac);
  const incrRev     = Math.round(incrUsers*revPerUser);
  const opsSav      = opsOn?Math.round(incrUsers*hrsSaved*hrCost):0;
  const fraudSav    = fraudOn?Math.round(fraudLoss*12*fraudPct/100):0;
  const totalVal    = incrRev+opsSav+fraudSav;
  const netVal      = incrRev-annTotal;
  const netValAdds  = totalVal-annTotal;
  const roiPct      = (annTotal+intCost)>0?Math.round(netVal/(annTotal+intCost)*100):null;
  const payback     = (incrRev/12)>0?Math.round((annTotal+intCost)/(incrRev/12)):null;

  // ── Copy text builders ──
  const pricingText = ()=>{
    const rows = [`PRICING SUMMARY — ${customer||(customer?"":"(customer name)")}`,`Date: ${new Date().toLocaleDateString()}`,``];
    rows.push(`PLATFORM`);
    if(pfTier) rows.push(`  Platform fee:   ${PF_TIERS.find(t=>t.id===pfTier)?.label} ${fmt(discTierAmt)}/mo${annPf>0?` · ${fmt(annPf)}/yr`:""}`);
    if(isPartner) rows.push(`  Partner fee:    ${fmt(partnerFee)}/mo · ${fmt(annPfee)}/yr`);
    if(commitFee>0) rows.push(`  API commitment: ${fmt(commitFee)}/mo`);
    if(!pfTier&&!isPartner&&!commitFee) rows.push(`  (none)`);
    rows.push(``);
    rows.push(`PRODUCTS (${products.filter(p=>p.included).length})`);
    products.filter(p=>p.included).forEach(p=>{
      const r=p.custom??p.rack;
      rows.push(`  ${p.name.padEnd(30)} ${r!=null?`$${r.toFixed(3)}`:  "TBD    "} /${p.type==="S"?"conn. acct":p.type==="R"?"user/mo":"call"}`);
    });
    rows.push(``);
    rows.push(`ANNUAL PROJECTION (Mo 12: ${endUsers.toLocaleString()} users)`);
    rows.push(`  Deal total:      ${fmt(annTotal)}`);
    if(annSavings>0) rows.push(`  vs Rack:         ${fmt(annSavings)} savings`);
    return rows.join("\n");
  };

  const roiText = ()=>{
    const rows = [`ROI SUMMARY — ${customer||(customer?"":"(customer name)")}`,`Date: ${new Date().toLocaleDateString()}`,``];
    rows.push(`ASSUMPTIONS`);
    rows.push(`  Revenue per user:       ${fmt(revPerUser)}/yr`);
    rows.push(`  Conversion rate:        ${curConv}% → ${newConv}% (New)`);
    rows.push(`  Incremental users (Mo 12): ${incrUsers.toLocaleString()}`);
    rows.push(``);
    rows.push(`VALUE`);
    rows.push(`  Incremental revenue:   ${fmt(incrRev)}/yr`);
    if(opsOn) rows.push(`  Ops savings:           ${fmt(opsSav)}/yr`);
    if(fraudOn) rows.push(`  Fraud savings:         ${fmt(fraudSav)}/yr`);
    rows.push(`  Total value:           ${fmt(totalVal)}/yr`);
    rows.push(``);
    rows.push(`COST & NET`);
    rows.push(`  New annual cost:     ${fmt(annTotal)}`);
    rows.push(`  Integration (est):     ${fmt(intCost)}`);
    rows.push(`  Net value:             ${fmt(netVal)}/yr`);
    if(opsSav+fraudSav>0) rows.push(`  Net value w/ add-ons:  ${fmt(netValAdds)}/yr`);
    if(roiPct!=null) rows.push(`  ROI:                   ${roiPct}%`);
    if(payback!=null) rows.push(`  Payback:               ${payback} months`);
    return rows.join("\n");
  };

  const dealText = ()=>[pricingText(),"","────────────────────────────────────────","\n"+roiText()].join("\n");

  const copy = (text,setFn)=>{ navigator.clipboard.writeText(text).then(()=>{ setFn(true); setTimeout(()=>setFn(false),2000); }); };

  const shared = {
    products,setProducts,monthlyUsers,setMonthlyUsers,avgAccounts,setAvgAccounts,
    commitFee,setCommitFee,pfTier,setPfTier,pfDiscount,setPfDiscount,
    pfRamp,setPfRamp,pfRampSched,setPfRampSched,
    isPartner,setIsPartner,partnerFee,setPartnerFee,
    breakdown,annTotal,annBase,annSavings,annPf,annPfee,endUsers,
    tierAmt,discTierAmt,
    revPerUser,setRevPerUser,curConv,setCurConv,newConv,setNewConv,
    intCost,setIntCost,opsOn,setOpsOn,hrsSaved,setHrsSaved,hrCost,setHrCost,
    fraudOn,setFraudOn,fraudLoss,setFraudLoss,fraudPct,setFraudPct,
    convFrac,incrUsers,incrRev,opsSav,fraudSav,totalVal,netVal,netValAdds,roiPct,payback,
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      {/* Header */}
      <div style={{background:C.card,borderBottom:`1px solid ${C.brd}`,padding:"11px 24px",display:"flex",alignItems:"center",gap:16}}>
        <span style={{...mono,fontSize:12,fontWeight:700,color:C.gold,letterSpacing:"0.12em",flexShrink:0}}>PRICING</span>
        <input
          value={customer} onChange={e=>setCustomer(e.target.value)}
          placeholder="Customer name…"
          style={{...mono,fontSize:14,background:"transparent",border:"none",borderBottom:`1px solid ${C.brd}`,color:C.txt,padding:"2px 4px",outline:"none",width:240,flexShrink:0}}
        />
        <div style={{flex:1}}/>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>copy(pricingText(),setCopiedP)} style={btn(copiedP,C.blue)}>{copiedP?"✓ Copied":"⊕ Copy Pricing"}</button>
          <button onClick={()=>copy(roiText(),setCopiedR)}     style={btn(copiedR,C.green)}>{copiedR?"✓ Copied":"⊕ Copy ROI"}</button>
          <button onClick={()=>copy(dealText(),setCopiedD)}    style={btn(copiedD,C.gold)}>{copiedD?"✓ Copied":"⊕ Copy Deal Summary"}</button>
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:`1px solid ${C.brd}`,padding:"0 24px",background:C.card}}>
        {[["pricing","Pricing Calculator"],["roi","ROI Calculator"],["summary","Deal Summary"]].map(([id,lb])=>(
          <button key={id} onClick={()=>setTab(id)} style={{...mono,fontSize:12,padding:"8px 18px",background:"transparent",border:"none",borderBottom:`2px solid ${tab===id?C.blue:"transparent"}`,color:tab===id?C.blue:C.dim,cursor:"pointer",fontWeight:tab===id?600:400,marginBottom:-1}}>{lb}</button>
        ))}
      </div>

      <div style={{padding:"20px 24px",maxWidth:1280,margin:"0 auto"}}>
        {tab==="pricing" && <PricingTab {...shared}/>}
        {tab==="roi"     && <RoiTab     {...shared}/>}
        {tab==="summary" && <SummaryTab {...shared} customer={customer} pricingText={pricingText()} roiText={roiText()} dealText={dealText()} copy={copy} copiedP={copiedP} setCopiedP={setCopiedP} copiedR={copiedR} setCopiedR={setCopiedR} copiedD={copiedD} setCopiedD={setCopiedD}/>}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
// PRICING TAB
// ─────────────────────────────────────────
function PricingTab(p) {
  const {products,setProducts,monthlyUsers,setMonthlyUsers,avgAccounts,setAvgAccounts,
    commitFee,setCommitFee,pfTier,setPfTier,pfDiscount,setPfDiscount,
    pfRamp,setPfRamp,pfRampSched,setPfRampSched,
    isPartner,setIsPartner,partnerFee,setPartnerFee,
    breakdown,annTotal,annSavings,annPf,annPfee,endUsers,tierAmt,discTierAmt} = p;

  const [search,setSearch] = useState("");
  const filtered = products.filter(q=>!search||q.name.toLowerCase().includes(search.toLowerCase()));
  const toggle = id => setProducts(ps=>ps.map(q=>q.id===id?{...q,included:!q.included}:q));
  const setCustom = (id,val) => setProducts(ps=>ps.map(q=>q.id===id?{...q,custom:val}:q));

  const TYPE_C = {S:C.blue,R:C.purple,T:C.orange};
  const TYPE_L = {S:"Single",R:"Recurring",T:"On-demand"};

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>

      {/* Platform fee + Commitment */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>

        {/* Platform fee */}
        <div style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",padding:"9px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card,gap:10}}>
            <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt}}>Platform Fee</span>
            <div style={{flex:1}}/>
            {/* Partner toggle */}
            <label style={{...mono,fontSize:11,color:isPartner?C.purple:C.mut,display:"flex",alignItems:"center",gap:5,cursor:"pointer"}}>
              <input type="checkbox" checked={isPartner} onChange={e=>setIsPartner(e.target.checked)} style={{accentColor:C.purple}}/>
              Partner
            </label>
            {isPartner&&(
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <span style={{...mono,fontSize:11,color:C.dim}}>$</span>
                <input type="number" min="0" step="100" value={partnerFee} onChange={e=>setPartnerFee(parseFloat(e.target.value)||0)}
                  style={{...inp(64,C.purple+"55"),color:C.purple}}/>
                <span style={{...mono,fontSize:11,color:C.dim}}>/mo</span>
              </div>
            )}
            {/* Ramp toggle */}
            <label style={{...mono,fontSize:11,color:pfRamp?C.gold:C.mut,display:"flex",alignItems:"center",gap:5,cursor:"pointer"}}>
              <input type="checkbox" checked={pfRamp} onChange={e=>setPfRamp(e.target.checked)} style={{accentColor:C.gold}}/>
              Ramp
            </label>
          </div>

          {/* Tier selector */}
          <div style={{padding:"8px 14px",display:"flex",gap:6}}>
            {PF_TIERS.map(t=>{
              const active=pfTier===t.id;
              return (
                <div key={t.id} onClick={()=>setPfTier(active?null:t.id)}
                  style={{cursor:"pointer",borderRadius:5,border:`1.5px solid ${active?C.gold:C.brd}`,background:active?`${C.gold}12`:C.card,padding:"5px 12px",display:"flex",alignItems:"center",gap:7}}>
                  <span style={{...mono,fontSize:12,fontWeight:600,color:active?C.gold:C.txt}}>{t.label}</span>
                  <span style={{...mono,fontSize:11,color:active?C.gold:C.mut}}>{fmt(t.amount)}/mo</span>
                  {active&&<span style={{...mono,fontSize:9,color:C.gold}}>✓</span>}
                </div>
              );
            })}
          </div>

          {/* Discount row */}
          {pfTier&&!pfRamp&&(
            <div style={{padding:"6px 14px 10px",borderTop:`1px solid ${C.brd}22`}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <label style={{...mono,fontSize:11,color:pfDiscount.enabled?C.green:C.mut,display:"flex",alignItems:"center",gap:6,cursor:"pointer",flexShrink:0}}>
                  <input type="checkbox" checked={pfDiscount.enabled} onChange={e=>setPfDiscount(d=>({...d,enabled:e.target.checked}))} style={{accentColor:C.green}}/>
                  Discount
                </label>
                {pfDiscount.enabled&&(
                  <>
                    <div style={{display:"flex",borderRadius:4,border:`1px solid ${C.brd}`,overflow:"hidden",flexShrink:0}}>
                      {["flat","pct"].map(typ=>(
                        <button key={typ} onClick={()=>setPfDiscount(d=>({...d,type:typ,amount:0}))}
                          style={{...mono,fontSize:10,padding:"2px 8px",background:pfDiscount.type===typ?`${C.green}22`:"transparent",border:"none",color:pfDiscount.type===typ?C.green:C.dim,cursor:"pointer"}}>
                          {typ==="flat"?"$":"% off"}
                        </button>
                      ))}
                    </div>
                    {pfDiscount.type==="flat"&&<span style={{...mono,fontSize:11,color:C.dim}}>-$</span>}
                    <input type="number" min="0" step={pfDiscount.type==="pct"?1:100} max={pfDiscount.type==="pct"?100:undefined}
                      value={pfDiscount.amount} onChange={e=>setPfDiscount(d=>({...d,amount:parseFloat(e.target.value)||0}))}
                      style={{...inp(64,C.green+"55"),color:C.green}}/>
                    {pfDiscount.type==="pct"&&<span style={{...mono,fontSize:11,color:C.dim}}>%</span>}
                    <span style={{...mono,fontSize:11,color:C.green,flexShrink:0}}>→ {fmt(discTierAmt)}/mo</span>
                  </>
                )}
                {!pfDiscount.enabled&&<span style={{...mono,fontSize:11,color:C.dim}}>{fmt(tierAmt)}/mo · {fmt(tierAmt*12)}/yr</span>}
              </div>
            </div>
          )}

          {/* Ramp schedule */}
          {pfRamp&&(
            <div style={{padding:"8px 14px 10px",background:`${C.gold}08`,borderTop:`1px solid ${C.brd}22`}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                <span style={{...mono,fontSize:9,color:C.gold,textTransform:"uppercase",letterSpacing:"0.08em"}}>Monthly Schedule</span>
                <div style={{display:"flex",gap:3,marginLeft:"auto"}}>
                  {PF_TIERS.map(t=>(
                    <button key={t.id}
                      onClick={()=>{ const v=window.prompt(`Fill all 12 months with ${t.label}?\nOr enter range like 1-6:`,""); if(v===null)return; const pts=v.trim().split("-").map(Number); const from=(pts[0]||1)-1; const to=(pts[1]||12)-1; setPfRampSched(s=>s.map((x,i)=>i>=from&&i<=to?t.amount:x)); }}
                      style={{...mono,fontSize:9,padding:"2px 6px",background:"transparent",border:`1px solid ${C.gold}44`,borderRadius:3,color:C.gold,cursor:"pointer"}}>{t.label}</button>
                  ))}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:4}}>
                {pfRampSched.map((v,i)=>{
                  const mt=PF_TIERS.find(t=>t.amount===v);
                  return (
                    <div key={i}>
                      <div style={{...mono,fontSize:8,color:mt?C.gold:C.dim,marginBottom:1}}>M{i+1}{mt?` ${mt.label[0]}`:""}</div>
                      <input type="number" min="0" step="500" value={v}
                        onChange={e=>setPfRampSched(s=>{const n=[...s];n[i]=parseFloat(e.target.value)||0;return n;})}
                        style={{...inp("100%",mt?C.gold+"88":C.gold+"22"),color:mt?C.gold:C.txt,fontSize:10,padding:"2px 4px"}}/>
                    </div>
                  );
                })}
              </div>
              <div style={{...mono,fontSize:9,color:C.gold,marginTop:5,textAlign:"right"}}>Annual: {fmt(pfRampSched.reduce((s,v)=>s+v,0))}</div>
            </div>
          )}
        </div>

        {/* API Commitment + User curve */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",padding:"9px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card,gap:10}}>
              <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt}}>API Commitment / mo</span>
            </div>
            <div style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
              <span style={{...mono,fontSize:11,color:C.dim}}>$</span>
              <input type="number" min="0" step="500" value={commitFee} onChange={e=>setCommitFee(parseFloat(e.target.value)||0)}
                style={{...inp(140),flex:1}}/>
              <span style={{...mono,fontSize:11,color:C.dim}}>{commitFee>0?`${fmt(commitFee*12)}/yr`:"/mo floor"}</span>
            </div>
          </div>

          <div style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",padding:"9px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card,gap:10}}>
              <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt}}>Monthly Users</span>
              <span style={{...mono,fontSize:10,color:C.dim,marginLeft:"auto"}}>Avg accts/user:
                <input type="number" min="1" step="0.1" value={avgAccounts} onChange={e=>setAvgAccounts(parseFloat(e.target.value)||1)}
                  style={{...inp(46),marginLeft:6,fontSize:11}}/>
              </span>
            </div>
            <div style={{padding:"8px 14px"}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:5}}>
                {monthlyUsers.map((v,i)=>(
                  <div key={i}>
                    <div style={{...mono,fontSize:8,color:C.dim,marginBottom:2}}>Mo {i+1}</div>
                    <input type="number" min="0" step="100" value={v}
                      onChange={e=>setMonthlyUsers(s=>{const n=[...s];n[i]=parseInt(e.target.value)||0;return n;})}
                      style={{...inp("100%"),fontSize:11,padding:"3px 4px"}}/>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",gap:8,marginTop:6}}>
                {[[0,1000,"→ 10k"],[1000,10000,"→ 10k"],[5000,50000,"→ 50k"],[10000,100000,"→ 100k"]].map(([start,end,lb],idx)=>(
                  <button key={idx} onClick={()=>setMonthlyUsers(Array.from({length:12},(_,i)=>Math.round(start+(end-start)*i/11)))}
                    style={{...mono,fontSize:9,padding:"2px 7px",background:"transparent",border:`1px solid ${C.brd}`,borderRadius:3,color:C.dim,cursor:"pointer"}}>{lb}</button>
                ))}
                <button onClick={()=>setMonthlyUsers(Array(12).fill(0))} style={{...mono,fontSize:9,padding:"2px 7px",background:"transparent",border:`1px solid ${C.brd}`,borderRadius:3,color:C.dim,cursor:"pointer"}}>Clear</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Products + Breakdown */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 420px",gap:12,alignItems:"start"}}>

        {/* Product table */}
        <div style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
          <div style={{padding:"8px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card}}>
            <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt}}>Products</span>
          </div>
          <div style={{padding:"6px 14px",borderBottom:`1px solid ${C.brd}22`}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Filter…"
              style={{...inp("100%"),fontSize:12}}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"24px 1fr 76px 80px 80px",padding:"6px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card}}>
            {["","PRODUCT","TYPE","RACK","CUSTOM"].map((h,i)=>(
              <span key={i} style={{...mono,fontSize:9,color:i>2?C.purple:C.dim,textAlign:i>=3?"right":"left",textTransform:"uppercase",letterSpacing:"0.07em"}}>{h}</span>
            ))}
          </div>
          <div style={{maxHeight:480,overflowY:"auto"}}>
            {filtered.map(q=>(
              <div key={q.id} style={{display:"grid",gridTemplateColumns:"24px 1fr 76px 80px 80px",padding:"4px 14px",borderBottom:`1px solid ${C.brd}14`,background:q.included?`${C.green}06`:"transparent",alignItems:"center"}}>
                <button onClick={()=>toggle(q.id)} style={{width:15,height:15,borderRadius:3,border:`1px solid ${q.included?C.green:C.brd}`,background:q.included?C.green:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,flexShrink:0}}>
                  {q.included&&<span style={{color:C.bg,fontSize:9,fontWeight:900,lineHeight:1}}>✓</span>}
                </button>
                <span style={{...mono,fontSize:11,color:q.included?C.txt:C.mut,paddingRight:6}}>{q.name}</span>
                <span style={{...mono,fontSize:10,color:TYPE_C[q.type],background:`${TYPE_C[q.type]}18`,borderRadius:3,padding:"1px 4px",whiteSpace:"nowrap",justifySelf:"start"}}>{TYPE_L[q.type]}</span>
                <div style={{textAlign:"right"}}><span style={{...mono,fontSize:11,color:C.dim}}>{fmtR(q.rack)}</span></div>
                <div style={{textAlign:"right"}}>
                  <input type="number" step="0.001" min="0" value={q.custom??""} placeholder={q.rack==null?"enter":""}
                    onChange={e=>setCustom(q.id,e.target.value===""?null:parseFloat(e.target.value))}
                    style={{...inp(70,q.rack==null?C.orange:C.brdM),textAlign:"right",fontSize:11,color:q.rack==null?C.orange:C.txt,padding:"2px 4px"}}/>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",padding:"7px 14px",borderTop:`1px solid ${C.brd}`,background:C.card}}>
            {Object.entries(TYPE_L).map(([k,v])=>(
              <span key={k} style={{...mono,fontSize:10,color:TYPE_C[k]}}>■ {v} — {k==="S"?"per new conn. acct":k==="R"?"per active user/mo":"per call"}</span>
            ))}
          </div>
        </div>

        {/* Monthly breakdown */}
        <div style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
          <div style={{padding:"8px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card,display:"flex",alignItems:"center",gap:8}}>
            <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt}}>Monthly Breakdown</span>
            <span style={{...mono,fontSize:11,color:C.gold,fontWeight:700,marginLeft:"auto"}}>{fmt(annTotal)}/yr</span>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",...mono,fontSize:11}}>
              <thead>
                <tr style={{background:C.card}}>
                  {["Mo","Users","Single","Recur.","Plat. fee",...(isPartner?["Partner"]:[]),"Total","Savings"].map((h,i)=>(
                    <th key={i} style={{padding:"5px 8px",textAlign:i===0?"center":"right",color:C.dim,fontWeight:500,borderBottom:`1px solid ${C.brd}44`,fontSize:10}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {breakdown.map((m,idx)=>{
                  const last=idx===11;
                  const td=(content,col,bold)=>({padding:"3px 7px",textAlign:"right",color:col,fontWeight:bold?700:400,borderBottom:last?"none":`1px solid ${C.brd}14`,whiteSpace:"nowrap"});
                  return (
                    <tr key={m.mo} style={{background:idx%2===0?"transparent":`${C.brd}14`}}>
                      <td style={{...td(null,C.mut,false),textAlign:"center"}}>Mo {m.mo}</td>
                      <td style={td(null,C.green,false)}>{m.active.toLocaleString()}</td>
                      <td style={td(null,m.single>0?C.blue:C.dim,false)}>{m.single>0?fmt(m.single):"—"}</td>
                      <td style={td(null,m.recur>0?C.purple:C.dim,false)}>{m.recur>0?fmt(m.recur):"—"}</td>
                      <td style={td(null,m.pf>0?C.mut:C.dim,false)}>{m.pf>0?fmt(m.pf):"—"}</td>
                      {isPartner&&<td style={td(null,C.purple,false)}>{m.pfee>0?fmt(m.pfee):"—"}</td>}
                      <td style={td(null,last?C.gold:C.txt,last)}>{fmt(m.total)}</td>
                      <td style={td(null,m.savings>0?C.green:m.savings<0?C.red:C.dim,Math.abs(m.savings)>0)}>
                        {m.savings!==0?(m.savings>0?"▲ ":"▼ ")+fmt(Math.abs(m.savings)):"—"}
                      </td>
                    </tr>
                  );
                })}
                <tr style={{background:`${C.gold}0A`,borderTop:`1px solid ${C.gold}33`}}>
                  <td style={{...mono,padding:"5px 7px",textAlign:"center",color:C.gold,fontWeight:700}}>Year</td>
                  <td style={{...mono,padding:"5px 7px",textAlign:"right",color:C.green}}>{endUsers.toLocaleString()}</td>
                  <td style={{...mono,padding:"5px 7px",textAlign:"right",color:C.blue}}>{fmt(breakdown.reduce((s,m)=>s+m.single,0))}</td>
                  <td style={{...mono,padding:"5px 7px",textAlign:"right",color:C.purple}}>{fmt(breakdown.reduce((s,m)=>s+m.recur,0))}</td>
                  <td style={{...mono,padding:"5px 7px",textAlign:"right",color:C.mut}}>{fmt(annPf)}</td>
                  {isPartner&&<td style={{...mono,padding:"5px 7px",textAlign:"right",color:C.purple,fontWeight:700}}>{fmt(annPfee)}</td>}
                  <td style={{...mono,padding:"5px 7px",textAlign:"right",color:C.gold,fontWeight:700}}>{fmt(annTotal)}</td>
                  <td style={{...mono,padding:"5px 7px",textAlign:"right",color:annSavings>=0?C.green:C.red,fontWeight:700}}>
                    {annSavings!==0?(annSavings>0?"▲ ":"▼ ")+fmt(Math.abs(annSavings)):"—"}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
// ROI TAB
// ─────────────────────────────────────────
function RoiTab(p) {
  const {endUsers,annTotal,
    revPerUser,setRevPerUser,curConv,setCurConv,newConv,setNewConv,
    intCost,setIntCost,opsOn,setOpsOn,hrsSaved,setHrsSaved,hrCost,setHrCost,
    fraudOn,setFraudOn,fraudLoss,setFraudLoss,fraudPct,setFraudPct,
    convFrac,incrUsers,incrRev,opsSav,fraudSav,totalVal,netVal,netValAdds,roiPct,payback} = p;

  const convWarn = (()=>{
    const c=curConv/100,pl=newConv/100;
    if(pl<c) return {type:"error",msg:"New conv rate should be higher — did you swap these?"};
    if(pl>0.95) return {type:"warn",msg:"Unusually high — double check"};
    if(pl<c*1.05&&pl>=c) return {type:"nudge",msg:"Lift below typical 10–25% range"};
    return null;
  })();

  const numInp = (val,setFn,step=1,prefix=null,suffix=null) => (
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      {prefix&&<span style={{...mono,fontSize:12,color:C.dim}}>{prefix}</span>}
      <input type="number" min="0" step={step} value={val}
        onChange={e=>setFn(parseFloat(e.target.value)||0)}
        style={{...inp(90),fontSize:13}}/>
      {suffix&&<span style={{...mono,fontSize:12,color:C.dim}}>{suffix}</span>}
    </div>
  );

  const row = (label,children,hint=null) => (
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:`1px solid ${C.brd}22`}}>
      <span style={{...mono,fontSize:12,color:C.mut,width:180,flexShrink:0}}>{label}</span>
      {children}
      {hint&&<span style={{...mono,fontSize:10,color:C.dim,marginLeft:"auto"}}>{hint}</span>}
    </div>
  );

  const hero = (label,val,col,sub=null) => (
    <div style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"14px 16px",flex:1}}>
      <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>{label}</div>
      <div style={{...mono,fontSize:20,fontWeight:700,color:col}}>{val}</div>
      {sub&&<div style={{...mono,fontSize:10,color:C.dim,marginTop:4}}>{sub}</div>}
    </div>
  );

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,alignItems:"start"}}>
      {/* Inputs */}
      <div style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
        <div style={{padding:"9px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card}}>
          <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt}}>Inputs</span>
          {endUsers>0&&<span style={{...mono,fontSize:10,color:C.green,marginLeft:12}}>Linked to pricing — {endUsers.toLocaleString()} users at Mo 12</span>}
        </div>
        <div style={{padding:"6px 16px 14px"}}>
          <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",padding:"10px 0 6px"}}>Revenue</div>
          {row("Revenue per user / yr", numInp(revPerUser,setRevPerUser,5,"$","/yr"), "Default: $75")}

          <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",padding:"10px 0 6px"}}>Conversion</div>
          {row("Current conv rate", numInp(curConv,setCurConv,1,null,"%"))}
          {row("Conv rate with us",
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {numInp(newConv,setNewConv,1,null,"%")}
              {convWarn&&<span style={{...mono,fontSize:10,color:convWarn.type==="error"?C.red:C.orange}}>{convWarn.msg}</span>}
            </div>
          )}
          {endUsers>0&&(
            <div style={{...mono,fontSize:10,color:C.dim,marginTop:6,padding:"6px 8px",background:C.card,borderRadius:5}}>
              {endUsers.toLocaleString()} users × ({newConv}%−{curConv}%) / {newConv}% = <span style={{color:C.green,fontWeight:600}}>{incrUsers.toLocaleString()} incremental</span>
              {convFrac<=0&&<span style={{color:C.red,marginLeft:6}}>— check your rates</span>}
            </div>
          )}

          <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",padding:"10px 0 6px"}}>Cost</div>
          {row("Integration cost (est)", numInp(intCost,setIntCost,1000,"$"), "One-time")}
          <div style={{...mono,fontSize:11,color:C.dim,padding:"4px 0",...mono}}>New annual cost: <span style={{color:C.txt,fontWeight:600}}>{fmt(annTotal)}</span>{annTotal===0&&<span style={{color:C.orange}}> — set up pricing first</span>}</div>

          <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",padding:"10px 0 6px"}}>Add-ons (optional)</div>
          <div style={{padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.brd}`,marginBottom:8}}>
            <label style={{...mono,fontSize:11,color:opsOn?C.blue:C.mut,display:"flex",alignItems:"center",gap:6,cursor:"pointer",marginBottom:opsOn?8:0}}>
              <input type="checkbox" checked={opsOn} onChange={e=>setOpsOn(e.target.checked)} style={{accentColor:C.blue}}/>
              Ops savings
            </label>
            {opsOn&&(
              <div style={{display:"flex",flexDirection:"column",gap:6,paddingTop:4}}>
                {row("Hrs saved / user", numInp(hrsSaved,setHrsSaved,0.1,null,"hrs"),"Default: 0.4")}
                {row("Cost / hour", numInp(hrCost,setHrCost,5,"$"))}
                <div style={{...mono,fontSize:11,color:C.blue}}>→ {fmt(opsSav)}/yr ops savings</div>
              </div>
            )}
          </div>
          <div style={{padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.brd}`}}>
            <label style={{...mono,fontSize:11,color:fraudOn?C.red:C.mut,display:"flex",alignItems:"center",gap:6,cursor:"pointer",marginBottom:fraudOn?8:0}}>
              <input type="checkbox" checked={fraudOn} onChange={e=>setFraudOn(e.target.checked)} style={{accentColor:C.red}}/>
              Fraud savings
            </label>
            {fraudOn&&(
              <div style={{display:"flex",flexDirection:"column",gap:6,paddingTop:4}}>
                {row("Monthly fraud loss", numInp(fraudLoss,setFraudLoss,1000,"$"))}
                {row("Reduction %", numInp(fraudPct,setFraudPct,5,null,"%"),"Default: 65%")}
                <div style={{...mono,fontSize:11,color:C.red}}>→ {fmt(fraudSav)}/yr fraud savings</div>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Results */}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"flex",gap:10}}>
          {hero("Incremental Revenue",fmt(incrRev)+"/yr",incrRev>=0?C.green:C.red,`${incrUsers.toLocaleString()} users × ${fmt(revPerUser)}`)}
          {hero("Net Value",fmt(netVal)+"/yr",netVal>=0?C.gold:C.red,"Revenue minus cost")}
        </div>
        {(opsSav+fraudSav)>0&&(
          <div style={{display:"flex",gap:10}}>
            {hero("Total Value w/ Add-ons",fmt(totalVal)+"/yr",C.blue,`+${fmt(opsSav+fraudSav)} in savings`)}
            {hero("Net w/ Add-ons",fmt(netValAdds)+"/yr",netValAdds>=0?C.gold:C.red,"")}
          </div>
        )}
        <div style={{display:"flex",gap:10}}>
          {hero("ROI",roiPct!=null?`${roiPct}%`:"—",roiPct!=null&&roiPct>=100?C.gold:roiPct!=null&&roiPct>=0?C.green:C.red,`vs ${fmt(annTotal+intCost)} total investment`)}
          {hero("Payback Period",payback!=null?`${payback} mo`:"—",payback!=null&&payback<=12?C.gold:payback!=null&&payback<=24?C.green:C.orange,payback!=null?`Break-even month ${payback}`:"Need pricing + conv data")}
        </div>

        {/* Cost breakdown */}
        <div style={{background:C.sur,borderRadius:8,border:`1px solid ${C.brd}`,padding:"14px 16px"}}>
          <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Value Breakdown</div>
          {[
            ["Incremental revenue",incrRev,C.green],
            opsSav>0?["Ops savings",opsSav,C.blue]:null,
            fraudSav>0?["Fraud savings",fraudSav,C.red]:null,
            ["Annual cost",-annTotal,C.orange],
            ["Integration cost (est)",-intCost,C.dim],
          ].filter(Boolean).map(([lb,v,col])=>(
            <div key={lb} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid ${C.brd}22`}}>
              <span style={{...mono,fontSize:11,color:C.mut}}>{lb}</span>
              <span style={{...mono,fontSize:11,color:v>=0?col:C.red,fontWeight:Math.abs(v)>0?500:400}}>{v>=0?"+":""}{fmt(v)}</span>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0 0",marginTop:4}}>
            <span style={{...mono,fontSize:12,color:C.txt,fontWeight:600}}>Net (w/ add-ons)</span>
            <span style={{...mono,fontSize:12,color:netValAdds>=0?C.gold:C.red,fontWeight:700}}>{fmt(netValAdds)}/yr</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────
// DEAL SUMMARY TAB
// ─────────────────────────────────────────
function SummaryTab({customer,pricingText,roiText,dealText,copy,copiedP,setCopiedP,copiedR,setCopiedR,copiedD,setCopiedD,
  annTotal,annSavings,incrRev,netVal,roiPct,payback,products,endUsers}) {

  const inc = products.filter(p=>p.included);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* Hero metrics */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
        {[
          ["Annual Cost", fmt(annTotal), C.gold],
          ["Savings vs Rack", annSavings>0?fmt(annSavings):"—", C.green],
          ["Incr. Revenue", incrRev>0?fmt(incrRev)+"/yr":"—", C.blue],
          ["Net Value", incrRev>0?fmt(netVal)+"/yr":"—", netVal>=0?C.green:C.red],
          ["ROI / Payback", roiPct!=null?`${roiPct}% · ${payback}mo`:"—", C.gold],
        ].map(([lb,val,col])=>(
          <div key={lb} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"12px 14px",textAlign:"center"}}>
            <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>{lb}</div>
            <div style={{...mono,fontSize:16,fontWeight:700,color:col}}>{val}</div>
          </div>
        ))}
      </div>

      {/* Products quick view */}
      {inc.length>0&&(
        <div style={{background:C.sur,borderRadius:8,border:`1px solid ${C.brd}`,padding:"12px 16px"}}>
          <div style={{...mono,fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:8}}>Included Products ({inc.length})</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {inc.map(p=><span key={p.id} style={{...mono,fontSize:11,padding:"2px 8px",background:C.bg,border:`1px solid ${C.brd}`,borderRadius:4,color:C.txt}}>{p.name}</span>)}
          </div>
        </div>
      )}

      {/* Three export panels */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
        {[
          {label:"Pricing Summary",text:pricingText,copied:copiedP,setCopied:setCopiedP,col:C.blue},
          {label:"ROI Summary",text:roiText,copied:copiedR,setCopied:setCopiedR,col:C.green},
          {label:"Full Deal Summary",text:dealText,copied:copiedD,setCopied:setCopiedD,col:C.gold},
        ].map(({label,text,copied,setCopied,col})=>(
          <div key={label} style={{background:C.sur,borderRadius:10,border:`1px solid ${C.brd}`,overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{display:"flex",alignItems:"center",padding:"9px 14px",borderBottom:`1px solid ${C.brd}`,background:C.card,gap:8}}>
              <span style={{...mono,fontSize:11,fontWeight:700,color:C.txt,flex:1}}>{label}</span>
              <button onClick={()=>copy(text,setCopied)} style={btn(copied,col)}>{copied?"✓ Copied":"Copy"}</button>
            </div>
            <pre style={{...mono,fontSize:10.5,color:C.mut,padding:"12px 14px",overflowX:"auto",flex:1,margin:0,lineHeight:1.65,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{text}</pre>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
